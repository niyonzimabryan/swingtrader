# Alembic configuration for SwingTrader.
#
# The application never shells out to this file: database/schema.py builds an
# equivalent Config in-process and hands Alembic a live connection. This file
# exists so the `alembic` CLI works for authoring and inspecting revisions.
#
# The URL is read from DATABASE_URL (see migrations/env.py); leaving
# sqlalchemy.url blank keeps credentials out of the repo.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =
