# Codex MCP server entry for the SwingTrader workspace (spec K section 4.3).
#
# Codex accepts a static bearer through `bearer_token_env_var`, which names an
# environment variable rather than holding the secret — so nothing here is a
# secret and this file is committed. Export WORKSPACE_TOKEN (and
# WORKSPACE_BASE_URL) before starting Codex; see docs/WORKSPACE_ACCESS.md.
#
# Codex reads this repo-local file and it OVERRIDES ~/.codex/config.toml
# (observed 2026-09-15, codex-cli 0.144.6: `codex mcp get` returns this entry
# from inside the repo and the global one from $HOME).
#
# Codex does NOT expand ${VAR} in `url` — it passes the raw string through, so
# the URL is written literally here. The hostname is not a secret; the bearer
# token is, and it stays out of the file via bearer_token_env_var.

[mcp_servers.swingtrader_workspace]
url = "https://workspace-production-6e7b.up.railway.app/mcp"
bearer_token_env_var = "WORKSPACE_TOKEN"
