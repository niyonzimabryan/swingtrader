# Railway config for the SECOND service in the project: the workspace API/MCP
# endpoint (spec K section 6). Same image as the bot, different start command.
#
# The bot's service keeps using `railway.toml`. Point this file at the new
# service through its "Config as code" setting (Railway service settings ->
# Config-as-code file path -> `railway.workspace.toml`); see
# docs/POSTGRES_CUTOVER_RUNBOOK.md, which is where the owner actions live.
# Creating the service and setting its variables is an owner action and has not
# been done from this branch.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m workspace.server"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

# No volume. The workspace holds no local state: Postgres is the store, and the
# per-token rate limiter is in-process by design (workspace/ratelimit.py), which
# is correct at numReplicas = 1 and is the reason to keep it there.
