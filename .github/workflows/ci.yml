name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A run on main is never cancelled by the next push landing minutes later —
  # main is the one branch where losing a completed CI result is worse than
  # the wall-clock this would save. Every other ref still cancels its
  # in-flight run when superseded, same as before.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Gitleaks must see the full commit graph, not only the PR tip.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: gitleaks git --redact --verbose .

  changes:
    # Decides whether the test job needs to run at all. A change confined to
    # prose and client configuration — docs, Markdown, the committed MCP client
    # files — cannot change what the suite would say, so it skips the test job
    # and keeps only the secret scan and lint. Anything else, and anything
    # under docs/robinhood/ (data a test may read), runs the suite.
    #
    # Fails open: with no reliable base to diff against — a first push, a
    # force-push, a workflow_dispatch — it runs the full suite rather than
    # guessing.
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify
        id: classify
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "no reliable base (${base:-empty}); running the full suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "-- changed files --"; echo "$changed"
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/robinhood/*) code=true ;;
              docs/*|*.md|.codex/*|.cursor/*|.mcp.json|specs/*|research/*) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    # This is a frozen repo, so CI is sized for "does a rare, small push still
    # pass" rather than for review-cycle throughput: one engine, one shard.
    #
    # SQLite runs on every event, pull request or push. Production ran on
    # Postgres, but the two engines never disagreed once across the week this
    # matrix was in use, and nothing here pushes often enough to justify a
    # second engine's wall-clock. The Postgres service container still starts
    # regardless: a handful of tests need it whichever engine the suite
    # targets (TEST_POSTGRES_URL).
    #
    # SHARD_COUNT=1 means scripts/ci_shard.py hands this single job the whole
    # suite (~1,469 tests) rather than splitting it across parallel jobs — the
    # split existed to shorten review cycles, and a frozen repo doesn't have
    # those.
    name: Python tests (sqlite)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      SHARD_COUNT: 1

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swingtrader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check installed package health
        run: python -m pip check

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            agents backtest bot comparables config data database evals execution \
            filings macro memo migrations news orchestrator portfolio scanning \
            scoring screening scripts strategy_lab tests tracking utils \
            workspace main.py

      - name: alembic upgrade head on an empty database
        # Exercises the CLI path (alembic.ini + DATABASE_URL) that the in-process
        # ensure_schema() does not cover, and proves the baseline applies cleanly
        # from nothing on this engine. Test coverage for schema equivalence lives
        # in tests/test_schema_discipline.py.
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci_swing_trader.db
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Select this shard's test modules
        id: modules
        run: |
          python -m scripts.ci_shard \
            --shard-index 0 --shard-count "$SHARD_COUNT" \
            --show-totals > shard_modules.txt
          echo "-- modules in this shard --"
          cat shard_modules.txt

      - name: Run unit tests
        env:
          # A handful of tests need Postgres regardless of the primary engine
          # under test — the SQLite->Postgres migration round-trip needs both
          # at once, and the concurrent-startup advisory lock has no SQLite
          # equivalent. Without this they skip, and a skipped cutover test is
          # not a passing one (spec K section 3.2).
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/swingtrader_test
        run: python -m unittest -v $(cat shard_modules.txt)
